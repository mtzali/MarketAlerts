name: Friday Bounce Predictor

on:
  schedule:
    # Thursday evening (6:00 PM ET = 22:00 UTC)
    - cron: '0 22 * * 4'
    # Friday pre-market (8:20 AM ET = 12:20 UTC)
    - cron: '20 12 * * 5'
    # Friday market open (9:10 AM ET = 13:10 UTC)
    - cron: '10 13 * * 5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Friday bounce predictor
        env:
          TELEGRAM_BOT_TOKEN_IWM: ${{ secrets.TELEGRAM_BOT_TOKEN_IWM }}
          TELEGRAM_CHAT_ID_IWM: ${{ secrets.TELEGRAM_CHAT_ID_IWM }}
        working-directory: Friday_Prediction
        run: python friday_bounce_predictor.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv' '*.db' '*.json' '*.png'
          git diff --staged --quiet || git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 0; }
          git push origin main
