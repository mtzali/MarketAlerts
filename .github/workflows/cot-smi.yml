name: COT SMI Analysis

on:
  schedule:
    # Friday post-market (4:35 PM ET = 20:35 UTC)
    - cron: '35 20 * * 5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dual index SMI
        working-directory: COT_SMI/SPY_NASDAQ/1_Core_Strategy
        run: python dual_index_SMI.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Auto-resolve binary .db conflicts by keeping our version
          git config merge.ours.driver true
          echo '*.db merge=ours' >> .git/info/attributes
          git add -A -- '*.csv' '*.db' '*.json' '*.png'
          git diff --staged --quiet || git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull origin main --no-rebase
          git push origin main
