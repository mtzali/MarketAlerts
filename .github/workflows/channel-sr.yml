name: IWM Channel S/R

on:
  schedule:
    # Pre-market (9:10 AM ET = 13:10 UTC)
    - cron: '10 13 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run channel S/R chart
        env:
          TELEGRAM_BOT_TOKEN_IWM: ${{ secrets.TELEGRAM_BOT_TOKEN_IWM }}
          TELEGRAM_CHAT_ID_IWM: ${{ secrets.TELEGRAM_CHAT_ID_IWM }}
        working-directory: IWM_ETF_ChannelSR
        run: python channel_sr_chart.py --interval 4h --period 90d

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Auto-resolve binary .db conflicts by keeping our version
          git config merge.ours.driver true
          echo '*.db merge=ours' >> .git/info/attributes
          git add -A -- '*.csv' '*.db' '*.json' '*.png'
          git diff --staged --quiet || git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull origin main --no-rebase
          git push origin main
