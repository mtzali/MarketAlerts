name: IWM Channel S/R

on:
  schedule:
    # Pre-market (9:10 AM ET = 13:10 UTC)
    - cron: '10 13 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run channel S/R chart
        env:
          TELEGRAM_BOT_TOKEN_IWM: ${{ secrets.TELEGRAM_BOT_TOKEN_IWM }}
          TELEGRAM_CHAT_ID_IWM: ${{ secrets.TELEGRAM_CHAT_ID_IWM }}
        working-directory: IWM_ETF_ChannelSR
        run: python channel_sr_chart.py --interval 4h --period 90d

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv' '*.db' '*.json' '*.png'
          git diff --staged --quiet && exit 0
          git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            # If rebase fails due to binary DB conflict, accept theirs and re-run the script's DB changes
            git rebase --abort 2>/dev/null || true
            git pull origin main --no-rebase -X theirs
            git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "Failed to push after 3 retries" && exit 1
