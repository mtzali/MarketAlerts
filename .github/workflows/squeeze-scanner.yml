name: Squeeze Scanner

on:
  schedule:
    # Pre-market optimized scan (7:00 AM ET = 11:00 UTC)
    - cron: '0 11 * * 1-5'
    # Pre-market fallen shorts (7:05 AM ET = 11:05 UTC)
    - cron: '5 11 * * 1-5'
    # Pre-market intraday premarket mode (7:10 AM ET = 11:10 UTC)
    - cron: '10 11 * * 1-5'
    # Market open confirm (9:35 AM ET = 13:35 UTC)
    - cron: '35 13 * * 1-5'
    # Post-market close summary (4:05 PM ET = 20:05 UTC)
    - cron: '5 20 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run optimized scanner
        if: github.event.schedule == '0 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN_SQUEEZE: ${{ secrets.TELEGRAM_BOT_TOKEN_SQUEEZE }}
          TELEGRAM_CHAT_ID_SQUEEZE: ${{ secrets.TELEGRAM_CHAT_ID_SQUEEZE }}
        working-directory: SqueezeScanner
        run: python optimized_scanner.py

      - name: Run fallen shorts tracker
        if: github.event.schedule == '5 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN_SQUEEZE: ${{ secrets.TELEGRAM_BOT_TOKEN_SQUEEZE }}
          TELEGRAM_CHAT_ID_SQUEEZE: ${{ secrets.TELEGRAM_CHAT_ID_SQUEEZE }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
        working-directory: SqueezeScanner
        run: python fallen_shorts_tracker.py

      - name: Run intraday scanner (premarket)
        if: github.event.schedule == '10 11 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN_SQUEEZE: ${{ secrets.TELEGRAM_BOT_TOKEN_SQUEEZE }}
          TELEGRAM_CHAT_ID_SQUEEZE: ${{ secrets.TELEGRAM_CHAT_ID_SQUEEZE }}
        working-directory: SqueezeScanner
        run: python intraday_scanner.py --mode premarket

      - name: Run intraday scanner (open)
        if: github.event.schedule == '35 13 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN_SQUEEZE: ${{ secrets.TELEGRAM_BOT_TOKEN_SQUEEZE }}
          TELEGRAM_CHAT_ID_SQUEEZE: ${{ secrets.TELEGRAM_CHAT_ID_SQUEEZE }}
        working-directory: SqueezeScanner
        run: python intraday_scanner.py --mode open

      - name: Run intraday scanner (close)
        if: github.event.schedule == '5 20 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN_SQUEEZE: ${{ secrets.TELEGRAM_BOT_TOKEN_SQUEEZE }}
          TELEGRAM_CHAT_ID_SQUEEZE: ${{ secrets.TELEGRAM_CHAT_ID_SQUEEZE }}
        working-directory: SqueezeScanner
        run: python intraday_scanner.py --mode close

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copy modified data files before pulling
          tmp_dir=$(mktemp -d)
          cp -f SqueezeScanner/*.db "$tmp_dir/" 2>/dev/null || true
          cp -f SqueezeScanner/*.csv "$tmp_dir/" 2>/dev/null || true
          cp -f SqueezeScanner/*.json "$tmp_dir/" 2>/dev/null || true
          cp -f SqueezeScanner/*.png "$tmp_dir/" 2>/dev/null || true
          for i in 1 2 3; do
            # Reset to clean state and pull latest
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull origin main || true
            # Restore our data files on top of latest
            cp -f "$tmp_dir"/*.db SqueezeScanner/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.csv SqueezeScanner/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.json SqueezeScanner/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.png SqueezeScanner/ 2>/dev/null || true
            git add -A -- '*.csv' '*.db' '*.json' '*.png'
            git diff --staged --quiet && exit 0
            git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "Failed to push after 3 retries" && exit 1
