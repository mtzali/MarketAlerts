name: Money Flow Strategy

on:
  schedule:
    # Post-market (4:40 PM ET = 20:40 UTC)
    - cron: '40 20 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unified daily report
        env:
          TELEGRAM_BOT_TOKEN_MAIN: ${{ secrets.TELEGRAM_BOT_TOKEN_MAIN }}
          TELEGRAM_CHAT_ID_MAIN: ${{ secrets.TELEGRAM_CHAT_ID_MAIN }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
        working-directory: MoneyFlow_Strategy
        run: python unified_daily_report.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copy modified data files before pulling
          tmp_dir=$(mktemp -d)
          cp -f MoneyFlow_Strategy/*.db "$tmp_dir/" 2>/dev/null || true
          cp -f MoneyFlow_Strategy/*.csv "$tmp_dir/" 2>/dev/null || true
          cp -f MoneyFlow_Strategy/*.json "$tmp_dir/" 2>/dev/null || true
          cp -f MoneyFlow_Strategy/*.png "$tmp_dir/" 2>/dev/null || true
          for i in 1 2 3; do
            # Reset to clean state and pull latest
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull origin main || true
            # Restore our data files on top of latest
            cp -f "$tmp_dir"/*.db MoneyFlow_Strategy/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.csv MoneyFlow_Strategy/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.json MoneyFlow_Strategy/ 2>/dev/null || true
            cp -f "$tmp_dir"/*.png MoneyFlow_Strategy/ 2>/dev/null || true
            git add -A -- '*.csv' '*.db' '*.json' '*.png'
            git diff --staged --quiet && exit 0
            git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "Failed to push after 3 retries" && exit 1
