name: Money Flow Strategy

on:
  schedule:
    # Post-market (4:40 PM ET = 20:40 UTC)
    - cron: '40 20 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unified daily report
        env:
          TELEGRAM_BOT_TOKEN_MAIN: ${{ secrets.TELEGRAM_BOT_TOKEN_MAIN }}
          TELEGRAM_CHAT_ID_MAIN: ${{ secrets.TELEGRAM_CHAT_ID_MAIN }}
          FINVIZ_AUTH: ${{ secrets.FINVIZ_AUTH }}
        working-directory: MoneyFlow_Strategy
        run: python unified_daily_report.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv' '*.db' '*.json' '*.png'
          git diff --staged --quiet || git commit -m "Auto-update: ${{ github.workflow }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 0; }
          git push origin main
